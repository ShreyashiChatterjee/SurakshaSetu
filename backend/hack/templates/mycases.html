<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cases - SurakshaSetu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #e6f3ff 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #d946ef 0%, #8b5cf6 100%);
            color: white;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        main {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            color: #1f2937;
            font-size: 2rem;
        }

        .report-btn {
            background: linear-gradient(135deg, #d946ef 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .report-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        /* REPORT FORM MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-header h2 {
            color: #8b5cf6;
            font-size: 1.5rem;
        }

        .close-btn {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4b5563;
            font-size: 0.9rem;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #d946ef 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        /* CASES LIST */
        #cases-list {
            display: grid;
            gap: 1.5rem;
        }

        .case-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #8b5cf6;
            transition: transform 0.2s;
        }

        .case-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .case-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .case-type {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
        }

        .type-harassment { background: #fee2e2; color: #ef4444; }
        .type-stalking { background: #fef3c7; color: #f59e0b; }
        .type-assault { background: #ffedd5; color: #ea580c; }
        .type-domestic-violence { background: #fce7f3; color: #be185d; }
        .type-other { background: #f3f4f6; color: #6b7280; }

        .case-date {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .case-info {
            margin-bottom: 1.5rem;
        }

        .case-info p {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-active { background: #dbeafe; color: #1e40af; }
        .status-under-investigation { background: #e0e7ff; color: #4338ca; }
        .status-resolved { background: #d1fae5; color: #065f46; }
        .status-closed { background: #f3f4f6; color: #4b5563; }

        .case-actions {
            display: flex;
            gap: 1rem;
            border-top: 1px solid #f3f4f6;
            padding-top: 1rem;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .delete-btn {
            background: #fee2e2;
            color: #ef4444;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
        }

        .empty-state h3 {
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: stretch;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .modal-content {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/home/" class="logo">
                <span>🛡️ SurakshaSetu</span>
            </a>
            <a href="/home/" class="back-link">← Back to Dashboard</a>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1>📋 My Reported Cases</h1>
            <button class="report-btn" id="open-report-modal">+ Report New Case</button>
        </div>

        <div id="cases-list"></div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <span class="empty-icon">📋</span>
            <h3>No cases reported yet</h3>
            <p>Any safety incidents you report will appear here for tracking.</p>
            <button class="report-btn" onclick="document.getElementById('open-report-modal').click()">Report Your First Case</button>
        </div>
    </main>

    <!-- REPORT CASE MODAL -->
    <div id="report-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📝 Report New Case</h2>
                <button class="close-btn" id="close-modal">×</button>
            </div>

            <form id="incident-form">
                <div class="form-group">
                    <label for="incident-type">Incident Type *</label>
                    <select id="incident-type" required>
                        <option value="">Select incident type</option>
                        <option value="harassment">Harassment</option>
                        <option value="stalking">Stalking</option>
                        <option value="assault">Physical Assault</option>
                        <option value="domestic-violence">Domestic Violence</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location *</label>
                    <input type="text" id="location" placeholder="Enter location where incident occurred" required>
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" placeholder="Describe what happened in detail..." required></textarea>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="anonymous">
                        <label for="anonymous" style="margin: 0;">Report anonymously</label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Submit Report</button>
            </form>
        </div>
    </div>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // MODAL CONTROLS
        const reportModal = document.getElementById('report-modal');
        const openModalBtn = document.getElementById('open-report-modal');
        const closeModalBtn = document.getElementById('close-modal');

        openModalBtn.addEventListener('click', () => {
            reportModal.classList.add('show');
        });

        closeModalBtn.addEventListener('click', () => {
            reportModal.classList.remove('show');
            document.getElementById('incident-form').reset();
        });

        reportModal.addEventListener('click', (e) => {
            if (e.target === reportModal) {
                reportModal.classList.remove('show');
                document.getElementById('incident-form').reset();
            }
        });

        // SUBMIT INCIDENT REPORT
document.getElementById('incident-form').addEventListener('submit', async function (e) {
    e.preventDefault();

    // Get the logged-in user from localStorage
    const storedUser = JSON.parse(localStorage.getItem('user'));

    // Collect form data
    const incidentData = {
        incident_type: document.getElementById('incident-type').value,
        location: document.getElementById('location').value,
        description: document.getElementById('description').value,
        is_anonymous: document.getElementById('anonymous').checked,
        user_id: storedUser ? storedUser.id : null // ✅ send user ID
    };

    const submitBtn = this.querySelector('.submit-btn');
    submitBtn.textContent = 'Submitting...';
    submitBtn.disabled = true;

    try {
        const response = await fetch('/api/save-case/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            credentials: 'include', // ✅ include cookies if Django session is active
            body: JSON.stringify(incidentData)
        });

        const result = await response.json();

        if (response.ok && result.status === 'success') {
            alert('✅ Case reported successfully!');
            reportModal.classList.remove('show');
            this.reset();
            loadCases();
        } else {
            alert(result.message || 'Failed to save case. Please try again.');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Failed to save case. Please check your connection and try again.');
    } finally {
        submitBtn.textContent = 'Submit Report';
        submitBtn.disabled = false;
    }
});


        // LOAD CASES FROM BACKEND
        async function loadCases() {
            const casesList = document.getElementById('cases-list');
            const emptyState = document.getElementById('empty-state');
            
            try {
                const response = await fetch('/api/get-cases/', {
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });
                
                const cases = await response.json();

                if (!cases || cases.length === 0) {
                    emptyState.style.display = 'block';
                    casesList.innerHTML = '';
                    return;
                }

                emptyState.style.display = 'none';
                casesList.innerHTML = cases.map(caseItem => `
                    <div class="case-card">
                        <div class="case-header">
                            <span class="case-type type-${caseItem.incident_type}">${formatIncidentType(caseItem.incident_type)}</span>
                            <span class="case-date">${formatDate(caseItem.created_at)}</span>
                        </div>
                        <div class="case-info">
                            <p><strong>📍 Location:</strong> ${caseItem.location}</p>
                            <p><strong>📝 Description:</strong> ${caseItem.description}</p>
                            <p><strong>👤 Anonymous:</strong> ${caseItem.is_anonymous ? 'Yes' : 'No'}</p>
                            <p><strong>📊 Status:</strong> <span class="status-badge status-${caseItem.status}">${formatStatus(caseItem.status)}</span></p>
                        </div>
                        <div class="case-actions">
                            <button class="action-btn delete-btn" onclick="deleteCase(${caseItem.id})">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading cases:', error);
                casesList.innerHTML = '<p style="text-align:center; color:#ef4444; background:white; padding:2rem; border-radius:8px;">Unable to load cases. Please refresh the page.</p>';
            }
        }

        function formatIncidentType(type) {
            return type.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function formatStatus(status) {
            return status.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-IN', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // DELETE CASE
        async function deleteCase(caseId) {
            if (!confirm('Are you sure you want to delete this case? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`/api/cases/${caseId}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });

                if (response.ok) {
                    alert('✅ Case deleted successfully');
                    loadCases();
                } else {
                    const data = await response.json();
                    alert(data.message || '❌ Failed to delete case.');
                }
            } catch (error) {
                console.error('Error deleting case:', error);
                alert('An error occurred while deleting the case.');
            }
        }

        // CHECK AUTHENTICATION
        window.addEventListener('DOMContentLoaded', function() {
            const storedUser = localStorage.getItem('user');
            if (!storedUser) {
                window.location.href = '/';
                return;
            }
            loadCases();
        });
    </script>
</body>
</html>
